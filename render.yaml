# Render Blueprint — deploys the API and the Razor Pages site as two free Docker web services.
# In Render: New + -> Blueprint -> pick this repo. Render will prompt for every `sync: false` value.
#
# Config keys use "__" in place of ":" (e.g. Jwt__Key == Jwt:Key), because appsettings.json
# is git-ignored and therefore not part of the deployed image.

services:
  - type: web
    name: arcanevault-api
    runtime: docker
    plan: free
    dockerfilePath: ./ArcaneVaultAPI/Dockerfile
    dockerContext: ./ArcaneVaultAPI
    healthCheckPath: /api/Showoff
    envVars:
      - key: RpSettings__BaseUrl        # e.g. https://arcanevault-rp.onrender.com  (no trailing slash)
        sync: false
      - key: Jwt__Issuer                # the API's own URL, e.g. https://arcanevault-api.onrender.com
        sync: false
      - key: Jwt__Audience              # the RP's URL, same value as RpSettings__BaseUrl
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__From
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false

  - type: web
    name: arcanevault-rp
    runtime: docker
    plan: free
    dockerfilePath: ./ArcaneVaultRP/Dockerfile
    dockerContext: ./ArcaneVaultRP
    envVars:
      - key: ApiSettings__BaseUrl       # e.g. https://arcanevault-api.onrender.com/api
        sync: false
      - key: ReCaptcha__SiteKey
        sync: false
      - key: ReCaptcha__SecretKey
        sync: false
